name: Mayo Home APK

# Baut bei jedem Push eine signierte Release-APK. Sie liegt danach immer unter derselben Adresse:
#   https://github.com/Jonathanxoxox/tvhome/releases/download/latest/MayoHome.apk
# (bei einem privaten Repo nur mit Anmeldung; zum Laden am Fernseher das Repo öffentlich machen).
on:
  push:
    branches: [ "main", "claude/**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      # Signiert wird mit dem Schlüssel aus dem Secret KEYSTORE_BASE64, damit jede neue APK sich über
      # die alte installiert. Fehlt das Secret, entsteht ein einmaliger Schlüssel nur für diesen Lauf.
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          KS="$RUNNER_TEMP/release.keystore"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
          else
            echo "::warning::Secret KEYSTORE_BASE64 fehlt, diese APK bekommt einen einmaligen Schlüssel."
            keytool -genkeypair -keystore "$KS" -storepass android -keypass android -alias sideload \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Mayo Home"
          fi
          echo "KEYSTORE_FILE=$KS" >> "$GITHUB_ENV"

      - name: Test and build
        env:
          VERSION_NAME: 0.1.${{ github.run_number }}
          KEYSTORE_PASSWORD: android
          KEY_ALIAS: sideload
          KEY_PASSWORD: android
        run: |
          export VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest assembleRelease --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/MayoHome.apk
          # Die App liest diese Datei, um neuere Versionen zu erkennen.
          printf '{"versionCode": %d, "versionName": "0.1.%d", "apkUrl": "https://github.com/%s/releases/download/latest/MayoHome.apk"}\n' \
            "$VERSION_CODE" "$GITHUB_RUN_NUMBER" "$GITHUB_REPOSITORY" > dist/version.json
          cat dist/version.json

      - uses: actions/upload-artifact@v7
        with:
          name: MayoHome
          path: dist/MayoHome.apk
          if-no-files-found: error

      # Läufe können sich überholen; veröffentlicht wird nur, was noch der neueste Stand ist, sonst zeigte
      # "latest" am Ende auf einen älteren Bau und der Updater böte ein Downgrade an.
      - name: Still the newest push?
        id: newest
        run: |
          HEAD=$(git ls-remote origin "$GITHUB_REF" | cut -f1)
          if [ -n "$HEAD" ] && [ "$HEAD" != "$GITHUB_SHA" ]; then
            echo "::notice::Überholt von ${HEAD::7}, diese APK wird nicht veröffentlicht."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Move tag "latest"
        if: github.ref_name == 'main' && steps.newest.outputs.ok == 'true'
        run: |
          git tag -f latest "$GITHUB_SHA"
          git push -f origin refs/tags/latest

      - name: Publish "latest" release
        if: github.ref_name == 'main' && steps.newest.outputs.ok == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Neueste Version
          prerelease: true
          make_latest: false
          body: "Automatisch gebaut aus ${{ github.ref_name }} @ ${{ github.sha }} (Version 0.1.${{ github.run_number }})"
          files: |
            dist/MayoHome.apk
            dist/version.json
